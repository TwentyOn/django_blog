{% extends 'base.html' %}
{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Обновить</button>
        <a class="btn btn-primary" href="{% url 'post_detail' post.slug %}">Назад к посту</a>
    </form>
{% endblock %}
