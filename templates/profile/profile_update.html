{% extends 'base.html' %}
{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-sm btn-primary">Подтвердить</button>
    </form>
    <br>
    <a class="btn btn-sm btn-primary" href="{% url 'profile_detail' profile.pk %}">Отмена</a>
{% endblock %}
